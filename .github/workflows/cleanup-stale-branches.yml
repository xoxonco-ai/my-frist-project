name: Cleanup stale branches (one-off)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete listed stale branches
        uses: actions/github-script@v7
        with:
          script: |
            // PR #32 was squash-merged as 850c64e; its branch is no longer needed.
            const branches = [
              'claude/vertical-shorts-subtitles-9kxv6l',
            ];
            for (const b of branches) {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${b}`,
              });
              core.info(`deleted: ${b}`);
            }
